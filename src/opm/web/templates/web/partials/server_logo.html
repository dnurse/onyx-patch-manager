{# Shared OPM server identity: fixed squircle + bottom-right protected badge. #}
<span class="server-logo{% if logo_large %} server-logo-large{% endif %}" title="{{ server.name }}{% if server.protected %} — Protected server{% endif %}">
  <img src="{% url 'server_logo' server.id %}" alt="" loading="lazy" width="40" height="40">
  {% if server.protected %}<span class="server-logo-lock" aria-label="Protected server" title="Protected server">
    <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none"><rect x="5" y="10" width="14" height="11" rx="2" fill="currentColor"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
  </span>{% endif %}
</span>
